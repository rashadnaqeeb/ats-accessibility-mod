# ============================================================
# F12 help-overlay entry descriptions
# ============================================================
# One short phrase per keybinding, read aloud by the F12 help overlay which
# lists "<keybinding>: <description>" for every binding active in the current
# context. Keep values under ~40 chars. Keys are grouped by the file whose
# HelpEntry list references them.
#
# Context notes for ambiguous terms:
# - "Resolve" (as in species_resolve) is the morale STAT (noun), not the verb.
# - "info" in bindings like tile_info / blight_info / range_info means the
#   short tooltip overlay for what the cursor is currently on.
# - "summary" bindings (quick_summary, time_summary, worker_summary) read an
#   aggregate spoken report of that subsystem.
# - "cycle" on the world-map handler refers to the game's World Map cycle
#   (the meta-progress loop ending in the Smoldering City reward popup),
#   not the verb "to cycle through items".
# - "panel" / "popup" bindings open an in-game menu; the description names
#   the destination, not the action.


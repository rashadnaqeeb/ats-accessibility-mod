# Hard-coded accessibility message for TutorialPhase 10 (CameraControl).
handler.tutorial.phase_10=Bienvenue dans Against the Storm ! Vous êtes actuellement en mode tutoriel. Vous pouvez appuyer sur Entrée pour fermer ces boîtes de tutoriel, mais vous devrez attendre la fin des animations. Explorez maintenant votre nouvelle colonie avec les touches fléchées.

# Hard-coded accessibility message for TutorialPhase 20 (Impatience).
handler.tutorial.phase_20=Négliger votre village augmentera l'Impatience de la reine et attirera sa colère sur vous. Vous perdrez la partie si la barre d'Impatience se remplit.

# Hard-coded accessibility message for TutorialPhase 30 (Reputation).
handler.tutorial.phase_30=Remplir vos devoirs augmentera la Réputation de la ville, débloquera de nouveaux bâtiments et vous mènera à la victoire. Vous pouvez consulter ces deux statistiques à la volée en appuyant sur S à tout moment en dehors de ces popups. Pour plus de détails, ouvrez l'écran de statistiques dédié, accessible depuis le menu d'information F1.

# Hard-coded accessibility message for TutorialPhase 35 (ReputationPick).
handler.tutorial.phase_35=En récompense des points de réputation gagnés, vous débloquez des plans — de nouveaux bâtiments à utiliser pour gagner la partie. L'un d'eux est prêt à être récupéré maintenant. Fermez ce popup et appuyez sur F3, le menu des récompenses. Choisissez des plans.

# Hard-coded accessibility message for TutorialPhase 40 (TimeControl).
handler.tutorial.phase_40=Vous pouvez maintenant appuyer sur la barre d'espace pour reprendre la partie. Si vous appuyez sur les touches 1 à 4, vous contrôlez la vitesse d'écoulement du temps.

# Hard-coded accessibility message for TutorialPhase 50 (Wood).
handler.tutorial.phase_50=Vous devez maintenant construire un camp de bûcherons. Consultez le fichier readme pour les instructions de construction. Le reste de ce tutoriel consiste à accomplir des missions, que vous trouverez dans le menu F2. Ceci est la dernière infobulle.

# Hard-coded accessibility message for TutorialPhase 340 (CyclePreFinish).
handler.tutorial.phase_340=Elle est presque sur nous, aucune caravane n'est donc autorisée à partir. Appuyez sur Ctrl+E pour terminer le cycle.


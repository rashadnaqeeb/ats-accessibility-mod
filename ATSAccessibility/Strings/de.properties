# Hard-coded accessibility message for TutorialPhase 10 (CameraControl).
handler.tutorial.phase_10=Willkommen bei Against the Storm! Du befindest dich jetzt im Tutorialmodus. Mit Enter kannst du diese Tutorial-Boxen ausblenden, musst aber das Ende der Animationen abwarten. Erkunde nun deine neue Siedlung mit den Pfeiltasten.

# Hard-coded accessibility message for TutorialPhase 20 (Impatience).
handler.tutorial.phase_20=Wenn du dein Dorf vernachlässigst, wächst die Ungeduld der Königin und sie wird ihren Zorn über dich bringen. Du verlierst das Spiel, wenn die Ungeduldsleiste gefüllt ist.

# Hard-coded accessibility message for TutorialPhase 30 (Reputation).
handler.tutorial.phase_30=Das Erfüllen deiner Pflichten erhöht die Reputation der Stadt, schaltet neue Gebäude frei und führt dich schließlich zum Sieg. Du kannst beide Werte jederzeit außerhalb dieser Popups mit S abfragen. Für mehr Details öffne den dedizierten Statistik-Bildschirm im F1-Infomenü.

# Hard-coded accessibility message for TutorialPhase 35 (ReputationPick).
handler.tutorial.phase_35=Als Belohnung für Reputationspunkte schaltest du Entwürfe frei – neue Gebäude, mit denen du das Spiel gewinnen kannst. Einer steht jetzt zur Abholung bereit. Schließe dieses Popup und drücke F3, das Belohnungsmenü. Wähle Entwürfe aus.

# Hard-coded accessibility message for TutorialPhase 40 (TimeControl).
handler.tutorial.phase_40=Du kannst nun mit der Leertaste das Spiel fortsetzen. Mit den Zahlen 1 bis 4 steuerst du die Geschwindigkeit des Zeitablaufs.

# Hard-coded accessibility message for TutorialPhase 50 (Wood).
handler.tutorial.phase_50=Nun musst du ein Holzfällerlager bauen. Bauanleitungen findest du in der Readme. Der Rest dieses Tutorials umfasst das Erfüllen von Aufträgen, die du im F2-Menü findest. Dies ist der letzte Tooltip.

# Hard-coded accessibility message for TutorialPhase 340 (CyclePreFinish).
handler.tutorial.phase_340=Er steht fast bevor, daher dürfen keine Karawanen aufbrechen. Drücke E, um den Zyklus abzuschließen.


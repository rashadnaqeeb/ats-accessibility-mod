# ATSAccessibility mod strings — English (fallback).
#
# Format: key=value (one per line). Lines starting with # or ! are comments.
# Positional args use {0}, {1}, ... so translators can reorder them.
# Escapes: \n \t \r \\ \=
#
# Key convention: scope.area.name
#   common.*            — reused across multiple files; check here first before adding a new key
#   panel.<name>.*      — specific to one panel
#   dialog.<name>.*     — confirmation / modal dialogs
#   overlay.<name>.*    — popup overlays
#   nav.<name>.*        — building navigators and mode controllers
#   event.*             — event announcements (EventAnnouncer, etc.)
#   util.*              — strings inside Utils/ helpers
#
# Each key has a comment above it describing where and how it's used, so
# translators know the context without reading the code.

# ============================================================
# common.*  — shared across panels/overlays
# ============================================================

# Spoken after the user opens a category that contains no items (e.g. presses
# Enter on an empty race group in WorkersPanel). Plain, no interpolation.
common.empty_category=No items in this category

# ============================================================
# dialog.confirm.*  — ConfirmationDialog (building destroy prompt)
# ============================================================

# Opening line of the destroy-building confirmation. {0} is the building name,
# already localized by the game (e.g. "Lumber Mill").
dialog.confirm.destroy=Destroy {0}?

# Label that precedes the refund list. A space is appended in code, then the
# list of "N Good" items separated by ", ". Ends with a period (added in code).
dialog.confirm.refund_prefix=Refund:

# One entry in the refund list. {0}=amount (int), {1}=good name (localized).
dialog.confirm.refund_item={0} {1}

# Trailing instructions for the confirmation dialog. Spoken after the refund
# list so the user knows which keys to press.
dialog.confirm.instructions=Enter to confirm, Escape to cancel

# Spoken when the user presses Escape to dismiss the confirmation.
dialog.confirm.cancelled=Cancelled

# ============================================================
# panel.help.*  — HelpOverlay (F12 context-sensitive help)
# ============================================================

# Announced when F12 opens the help overlay. This is the ONLY thing spoken on
# open — no entry preview or context name.
panel.help.title=Help menu

# Spoken when F12 is pressed but no help entries are available in the current
# context. Rare in practice.
panel.help.empty=No keys available

# One row in the help list. {0}=key combo (e.g. "F1"), {1}=description.
panel.help.entry={0}: {1}

# Spoken when the user closes the help overlay with Escape.
panel.help.closed=Closed

# ============================================================
# panel.workers.*  — WorkersPanel (profession counts by race)
# ============================================================

# OverlayName / opening announcement of the workers panel.
panel.workers.title=Workers panel

# Spoken on open when no villagers have professions yet.
panel.workers.empty=No workers present

# Name of the first category that aggregates professions across all races.
panel.workers.all_category=All

# One row in a category. {0}=profession name (localized), {1}=count (int).
panel.workers.item={0}, {1}

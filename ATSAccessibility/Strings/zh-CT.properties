# ------------------------------------------------------------

# Placeholder used when a recipe has no listed ingredients. Returned both
# when the goods array is empty and when no ingredient lines were built.
util.recipe_formatter.nothing=無。

# Single ingredient entry: one good with an amount. {0}=good name (localized),
# {1}=amount (int). Period at the end matches the other list forms.
util.recipe_formatter.single={0} x {1}。

# Alternative list where every option uses the same amount. {0}=shared amount
# (int), {1}=comma-separated good names. Example: "3 x Herbs, Insects, Resin."
util.recipe_formatter.same_amounts={0} x {1}。

# Alternative list where options have different amounts. {0}=comma-separated
# "Name x Amount" entries, already composed by util.recipe_formatter.diff_item.
# Example: "One of Stone x 4, Clay x 4, Salt x 3."
util.recipe_formatter.different_amounts=其中之一:{0}。

# One entry inside util.recipe_formatter.different_amounts. {0}=good name,
# {1}=amount (int).
util.recipe_formatter.diff_item={0} x {1}

# Production time announcement. {0}=seconds (int).
util.recipe_formatter.time=耗時 {0} 秒。


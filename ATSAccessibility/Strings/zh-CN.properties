# ATSAccessibility mod strings — English (fallback).
#
# Format: key=value (one per line). Lines starting with # or ! are comments.
# Positional args use {0}, {1}, ... so translators can reorder them.
# Escapes: \n \t \r \\ \=
#
# Key convention: scope.area.name
#   common.*            — reused across multiple files; check here first before adding a new key
#   panel.<name>.*      — specific to one panel
#   dialog.<name>.*     — confirmation / modal dialogs
#   overlay.<name>.*    — popup overlays
#   nav.<name>.*        — building navigators and mode controllers
#   event.*             — event announcements (EventAnnouncer, etc.)
#   util.*              — strings inside Utils/ helpers
#
# Each key has a comment above it describing where and how it's used, so
# translators know the context without reading the code.

# ============================================================
# common.*  — shared across panels/overlays
# ============================================================


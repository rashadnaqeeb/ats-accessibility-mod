# Hard-coded accessibility message for TutorialPhase 50 (Wood).
handler.tutorial.phase_50=Ahora tendrás que construir un campamento de leñadores. Consulta el léeme para las instrucciones de construcción. El resto del tutorial consiste en completar órdenes, que puedes ver en el menú F2. Este es el último aviso.

# Hard-coded accessibility message for TutorialPhase 340 (CyclePreFinish).
handler.tutorial.phase_340=Ya casi llega, así que no se permiten caravanas para embarcar. Presiona E para terminar el ciclo.


# Hard-coded accessibility message for TutorialPhase 30 (Reputation).
handler.tutorial.phase_30=Cumplir con tus deberes aumentará la Reputación del pueblo, desbloqueará nuevos edificios y, a la larga, te llevará a la victoria. Puedes consultar ambas estadísticas sobre la marcha presionando S en cualquier momento fuera de estas ventanas. Para más detalles, abre la pantalla de estadísticas dedicada, en el menú de información F1.

# Hard-coded accessibility message for TutorialPhase 35 (ReputationPick).
handler.tutorial.phase_35=Como recompensa por ganar puntos de reputación, desbloqueas planos: nuevos edificios para usar y ganar la partida. Ya puedes recoger uno. Cierra esta ventana y presiona F3, el menú de recompensas. Elige planos.

# Hard-coded accessibility message for TutorialPhase 40 (TimeControl).

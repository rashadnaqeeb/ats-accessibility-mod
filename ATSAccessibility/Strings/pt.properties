# Hard-coded accessibility message for TutorialPhase 35 (ReputationPick).
handler.tutorial.phase_35=Como recompensa por ganhar pontos de reputação, você desbloqueia Projetos - novos edifícios para usar e vencer o jogo. Um está pronto para ser coletado agora. Dispense esta janela e pressione F3, o menu de recompensas. Escolha Projetos.

# Hard-coded accessibility message for TutorialPhase 40 (TimeControl).

# Hard-coded accessibility message for TutorialPhase 50 (Wood).
handler.tutorial.phase_50=Agora, você terá de construir um acampamento de lenhadores. Consulte o leia-me para instruções de construção. O restante deste tutorial envolve concluir Ordens, que você encontra no menu F2. Esta é a última dica.

# Hard-coded accessibility message for TutorialPhase 340 (CyclePreFinish).

# Hard-coded accessibility message for TutorialPhase 10 (CameraControl).
handler.tutorial.phase_10=Добро пожаловать в Against the Storm! Вы находитесь в режиме обучения. Нажимайте Enter, чтобы закрывать обучающие окна, но придётся подождать окончания анимации. А теперь исследуйте ваше новое поселение с помощью клавиш-стрелок.

# Hard-coded accessibility message for TutorialPhase 20 (Impatience).
handler.tutorial.phase_20=Пренебрежение деревней увеличит Нетерпение королевы и навлечёт её гнев. Вы проиграете, если шкала Нетерпения заполнится.

# Hard-coded accessibility message for TutorialPhase 30 (Reputation).
handler.tutorial.phase_30=Выполнение обязанностей повысит Репутацию города, откроет новые здания и в конце концов приведёт вас к победе. Вы можете проверить эти показатели в любой момент, нажав S вне всплывающих окон. Для подробностей откройте отдельный экран статистики в меню информации F1.

# Hard-coded accessibility message for TutorialPhase 35 (ReputationPick).
handler.tutorial.phase_35=В награду за очки Репутации вы получаете чертежи — новые здания, которые помогут победить. Один уже готов к получению. Закройте это окно и нажмите F3 — меню наград. Выберите чертеж.

# Hard-coded accessibility message for TutorialPhase 40 (TimeControl).
handler.tutorial.phase_40=Теперь нажмите пробел, чтобы возобновить игру. Клавиши 1–4 управляют скоростью течения времени.

# Hard-coded accessibility message for TutorialPhase 50 (Wood).
handler.tutorial.phase_50=Теперь вам нужно построить лагерь дровосеков. Инструкции по строительству смотрите в README. Остальная часть обучения — выполнение указов, которые находятся в меню F2. Это последняя подсказка.

# Hard-coded accessibility message for TutorialPhase 340 (CyclePreFinish).
handler.tutorial.phase_340=Это уже близко, поэтому караваны не могут отправляться. Нажмите E, чтобы завершить цикл.

